name: PulseChain Signals Monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pulsechain-signals-monitor.yml
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pulsechain-signals-monitor
  cancel-in-progress: false

jobs:
  scan:
    name: Refresh verified feed
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Sample watcher and drain backlog
        shell: bash
        env:
          SIGNALS_URL: https://pulsechain-signals.brohexphiat.chatgpt.site/api/v1/signals?limit=1&scheduler=github-actions
        run: |
          set -euo pipefail

          samples=5
          for attempt in $(seq 1 "${samples}"); do
            sample_started="$(date +%s)"
            body="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                --retry 2 \
                --retry-all-errors \
                --connect-timeout 10 \
                --max-time 30 \
                --header "Cache-Control: no-cache" \
                --header "User-Agent: pulsechain-signals-scheduler/2.0" \
                "${SIGNALS_URL}&sample=${attempt}"
            )"

            error="$(jq -r '.watcher.last_error // empty' <<<"${body}")"
            if [[ -n "${error}" ]]; then
              printf 'Watcher error: %s\n' "${error}" >&2
              exit 1
            fi

            status="$(jq -r '.watcher.status // "unknown"' <<<"${body}")"
            block="$(jq -r '.watcher.last_scanned_block // 0' <<<"${body}")"
            behind="$(jq -r '.watcher.blocks_behind // 0' <<<"${body}")"
            refresh="$(jq -r '.refresh.state // "unknown"' <<<"${body}")"
            printf 'sample=%s status=%s refresh=%s block=%s behind=%s\n' \
              "${attempt}" "${status}" "${refresh}" "${block}" "${behind}"

            if (( attempt < samples )); then
              elapsed=$(( $(date +%s) - sample_started ))
              wait_seconds=$(( 60 - elapsed ))
              if (( wait_seconds > 0 )); then
                sleep "${wait_seconds}"
              fi
            fi
          done

          final="$(
            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --retry 2 \
              --retry-all-errors \
              --connect-timeout 10 \
              --max-time 20 \
              --header "Cache-Control: no-cache" \
              --header "User-Agent: pulsechain-signals-scheduler/2.0" \
              "https://pulsechain-signals.brohexphiat.chatgpt.site/api/v1/watcher?scheduler=github-actions"
          )"

          error="$(jq -r '.last_error // empty' <<<"${final}")"
          if [[ -n "${error}" ]]; then
            printf 'Watcher error: %s\n' "${error}" >&2
            exit 1
          fi

          jq '{status, last_scanned_block, safe_head_block, blocks_behind, rpc_quorum, last_completed_at}' <<<"${final}"
