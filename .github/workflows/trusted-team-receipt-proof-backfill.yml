name: Trusted Team · Receipt Proof Backfill
on:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  actions: read
  id-token: write
concurrency:
  group: trusted-team-receipt-proof-backfill
  cancel-in-progress: false
jobs:
  project:
    if: >-
      github.repository == 'opus99999/pulsechain-mcp' &&
      github.repository_id == '1320639709' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'opus99999' &&
      github.actor_id == '212180323'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
      - name: Project fixed historical receipt proofs and verify replay
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_REPOSITORY_OWNER_ID: ${{ github.repository_owner_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: node scripts/trusted-team-receipt-projector.mjs --historical-backfill
